<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrito | ChocoAura</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>


<body>


    <!-- ENCABEZADO -->

    <header class="header">

        <a href="index.html" class="logo-enlace">

            <img src="img/logo.png"
                 alt="Logo Choco Aura"
                 class="logo">

        </a>


        <nav class="menu">

            <a href="index.html">
                <i class="fa-solid fa-house"></i>
                Inicio
            </a>

            <a href="nosotros.html">
                <i class="fa-solid fa-heart"></i>
                Nosotros
            </a>

            <a href="productos.html">
                <i class="fa-solid fa-box-open"></i>
                Productos
            </a>

            <a href="contacto.html">
                <i class="fa-solid fa-envelope"></i>
                Contacto
            </a>

            <a href="carrito.html">
                <i class="fa-solid fa-cart-shopping"></i>
                Carrito
                <span id="contador-carrito">0</span>
            </a>

        </nav>

    </header>


    <!-- TÍTULO -->

    <section class="titulo-carrito">

        <h1>Mi carrito 🛒</h1>

    

    </section>


    <!-- CARRITO -->

    <main class="carrito-contenedor">


        <div id="lista-carrito">

        </div>


        <!-- RESUMEN -->

        <div class="resumen-carrito">

            <h2>Resumen de compra</h2>

            <div class="linea-total">

                <span>Total</span>

                <strong id="total-carrito">
                    $0
                </strong>

            </div>


            <button class="boton-comprar"
                    onclick="comprar()">

                <i class="fa-solid fa-bag-shopping"></i>

                Comprar por whatsapp 

            </button>


            <a href="productos.html"
               class="seguir-comprando">

                <i class="fa-solid fa-arrow-left"></i>

                Seguir comprando

            </a>

        </div>

    </main>


    <!-- PIE DE PÁGINA -->

    <footer class="footer">

        <div class="footer-contenido">


            <div class="footer-columna">

                <h3>Choco Aura</h3>

                <p>
                    Chocolaterapia en la comodidad
                    de tu hogar.
                </p>

            </div>


            <div class="footer-columna">

                <h3>Menú</h3>

                <a href="index.html">Inicio</a>

                <a href="nosotros.html">Nosotros</a>

                <a href="productos.html">Productos</a>

                <a href="contacto.html">Contacto</a>

                <a href="carrito.html">Carrito</a>

            </div>


            <div class="footer-columna">

                <h3>Síguenos</h3>

                <a href="https://www.instagram.com/chocoaura_kit/"
                   target="_blank">

                    <i class="fa-brands fa-instagram"></i>
                    Instagram

                </a>


                <a href="https://www.tiktok.com/@chocoaura_kit"
                   target="_blank">

                    <i class="fa-brands fa-tiktok"></i>
                    TikTok

                </a>


                <a href="https://wa.me/573011549419"
                   target="_blank">

                    <i class="fa-brands fa-whatsapp"></i>
                    WhatsApp

                </a>

            </div>

        </div>


        <div class="copyright">

            © 2026 ChocoAura 

        </div>

    </footer>


    <!-- FUNCIONAMIENTO DEL CARRITO -->

    <script>


        function obtenerCarrito() {

            return JSON.parse(
                localStorage.getItem("carrito")
            ) || [];

        }


        function guardarCarrito(carrito) {

            localStorage.setItem(
                "carrito",
                JSON.stringify(carrito)
            );

        }


        function mostrarCarrito() {

            let carrito = obtenerCarrito();

            let lista =
                document.getElementById("lista-carrito");

            let total = 0;

            let cantidadTotal = 0;


            lista.innerHTML = "";


            /* SI EL CARRITO ESTÁ VACÍO */

            if (carrito.length === 0) {

                lista.innerHTML = `

                    <div class="carrito-vacio">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <h2>Tu carrito está vacío</h2>

                        <p>
                            Agrega productos de Choco Aura
                            para comenzar.
                        </p>

                        <a href="productos.html">
                            Ver productos
                        </a>

                    </div>

                `;

            }


            /* MOSTRAR PRODUCTOS */

            carrito.forEach(function(producto, indice) {


                let subtotal =
                    producto.precio *
                    producto.cantidad;


                total += subtotal;

                cantidadTotal +=
                    producto.cantidad;


                lista.innerHTML += `

                    <div class="producto-carrito">


                        <div class="informacion-producto">

                            <h2>
                                ${producto.nombre}
                            </h2>

                            <p>
                                $${producto.precio.toLocaleString("es-CO")}
                            </p>

                        </div>


                        <div class="cantidad">

                            <button
                                onclick="disminuir(${indice})">

                                −

                            </button>


                            <span>
                                ${producto.cantidad}
                            </span>


                            <button
                                onclick="aumentar(${indice})">

                                +

                            </button>

                        </div>


                        <div class="subtotal">

                            <strong>
                                $${subtotal.toLocaleString("es-CO")}
                            </strong>

                        </div>


                        <button
                            class="eliminar"
                            onclick="eliminar(${indice})">

                            <i class="fa-solid fa-trash"></i>

                        </button>


                    </div>

                `;

            });


            document.getElementById(
                "total-carrito"
            ).innerText =
                "$" + total.toLocaleString("es-CO");


            document.getElementById(
                "contador-carrito"
            ).innerText =
                cantidadTotal;

        }



        /* AUMENTAR */

        function aumentar(indice) {

            let carrito = obtenerCarrito();

            carrito[indice].cantidad++;

            guardarCarrito(carrito);

            mostrarCarrito();

        }



        /* DISMINUIR */

        function disminuir(indice) {

            let carrito = obtenerCarrito();


            if (carrito[indice].cantidad > 1) {

                carrito[indice].cantidad--;

            } else {

                carrito.splice(indice, 1);

            }


            guardarCarrito(carrito);

            mostrarCarrito();

        }



        /* ELIMINAR */

        function eliminar(indice) {

            let carrito = obtenerCarrito();

            carrito.splice(indice, 1);

            guardarCarrito(carrito);

            mostrarCarrito();

        }



        


        /* MOSTRAR CARRITO AL ABRIR LA PÁGINA */

        mostrarCarrito();

        /* COMPRAR POR WHATSAPP */

        function comprar() {

            let carrito = obtenerCarrito();

            if (carrito.length === 0) {
                alert("Tu carrito está vacío. Agrega productos antes de comprar.");
                return;
            }

            let mensaje = "¡Hola! Quiero realizar un pedido de Choco Aura:\n\n";
            let total = 0;

            carrito.forEach(function(producto) {

                let subtotal = producto.precio * producto.cantidad;

                total += subtotal;

                mensaje += "• " + producto.nombre +
                    " x " + producto.cantidad +
                    " = $" + subtotal.toLocaleString("es-CO") + "\n";

            });

            mensaje += "\nTOTAL DEL PEDIDO: $" +
                total.toLocaleString("es-CO");

            mensaje += "\n\n¿Me ayudan a confirmar mi pedido?";

            let telefono = "573011549419";

            let enlace = "https://wa.me/" + telefono +
                "?text=" + encodeURIComponent(mensaje);

            window.open(enlace, "_blank");

        }


    </script>


</body>

</html>
